name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust 툴체인 (rust-toolchain.toml)
        run: rustup show
      - name: 테스트
        run: cargo test --release
      - name: 빌드
        run: cargo build --release
