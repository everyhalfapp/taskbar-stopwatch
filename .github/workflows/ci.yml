name: CI

on:
  push:
    branches: [main]
  pull_request:

# 기본 토큰은 읽기 전용
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 서드파티 액션은 태그 대신 커밋 SHA 로 고정 (태그가 바뀌어도 영향 없음)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Rust 툴체인 (rust-toolchain.toml)
        run: rustup show
      - name: 테스트
        run: cargo test --release
      - name: 빌드
        run: cargo build --release
