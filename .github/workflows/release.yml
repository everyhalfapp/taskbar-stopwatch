name: Release

# v1.0.0 같은 태그를 올리면 빌드해서 GitHub Releases 에 zip 을 첨부한다.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust 툴체인 (rust-toolchain.toml)
        run: rustup show
      - name: 패키징
        shell: pwsh
        run: ./scripts/package.ps1
      - name: GitHub Release 만들기
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.zip
            dist/*.zip.sha256
