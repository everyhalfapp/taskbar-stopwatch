[package]
name = "taskbar-stopwatch"
version = "1.0.1"
edition = "2021"
description = "A tiny stopwatch widget that sits on the Windows taskbar to track your real working time."
license = "MIT"
authors = ["everyhalfapp"]
repository = "https://github.com/everyhalfapp/taskbar-stopwatch"
readme = "README.md"
keywords = ["stopwatch", "taskbar", "widget", "windows", "timer"]
categories = ["gui"]
build = "build.rs"
publish = false

[[bin]]
name = "TaskbarStopwatch"
path = "src/main.rs"

[dependencies.windows]
version = "=0.58.0"
features = [
  "Foundation_Numerics",
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
